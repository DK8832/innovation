name: CERTI:ON 전체 릴리스 Android APK 빌드·첨부

on:
  push:
    branches:
      - build-release-apks
    paths:
      - '.github/workflows/build-release-apks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: ${{ matrix.tag }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        tag:
          - v0.1.0
          - v0.2.0
          - v0.3.0
          - v0.4.0
          - v0.5.0
          - v0.6.0
          - v0.7.0
          - v0.8.0
          - v0.9.0
          - v0.10.0
          - v0.11.0
          - v0.12.0
          - v0.13.0
          - v0.14.0
          - v0.15.0
          - v0.16.0
          - v0.17.0
          - v0.18.0
          - v0.19.0
          - v0.20.0
          - v0.21.0
          - v0.22.0
          - v0.23.0
          - v1.0.0
          - v2.0.0

    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ matrix.tag }}

    steps:
      - name: 기존 APK Asset 확인
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="CERTI_ON_${TAG}_ANDROID.apk"
          echo "EXPECTED_APK=$EXPECTED" >> "$GITHUB_ENV"
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -Fxq "$EXPECTED"; then
            echo "이미 $EXPECTED 가 존재하므로 재빌드를 건너뜁니다."
            echo "SKIP_BUILD=true" >> "$GITHUB_ENV"
          else
            echo "SKIP_BUILD=false" >> "$GITHUB_ENV"
          fi

      - name: 빌드 도구 준비
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip zip jq

      - name: Flutter 3.35.5 설치
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.35.5 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version
          "$HOME/flutter/bin/flutter" config --no-analytics

      - name: 해당 릴리스의 실제 원본 소스 ZIP 다운로드
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-src"
          ASSET="$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[] | select(.name | test("SOURCE\\.zip$")) | .name' | head -n 1)"
          if [ -z "$ASSET" ]; then
            echo "::error::$TAG 릴리스에서 SOURCE.zip 원본 Asset을 찾지 못했습니다."
            exit 1
          fi
          echo "SOURCE_ASSET=$ASSET" >> "$GITHUB_ENV"
          gh release download "$TAG" -R "$REPO" --pattern "$ASSET" --dir "$RUNNER_TEMP/release-src"
          test -s "$RUNNER_TEMP/release-src/$ASSET"
          echo "원본 Asset: $ASSET"

      - name: 소스 압축 해제 및 Flutter 프로젝트 루트 탐지
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/project"
          unzip -q "$RUNNER_TEMP/release-src/$SOURCE_ASSET" -d "$RUNNER_TEMP/project"
          chmod -R u+rwX "$RUNNER_TEMP/project"
          ROOT="$(python3 - <<'PY'
          import os
          from pathlib import Path
          base = Path(os.environ['RUNNER_TEMP']) / 'project'
          candidates = []
          for p in base.rglob('pubspec.yaml'):
              rel = p.relative_to(base)
              if any(x in {'.dart_tool', 'build'} for x in rel.parts):
                  continue
              score = (len(rel.parts), 1 if 'packages' in rel.parts else 0, str(rel))
              candidates.append((score, p.parent))
          if not candidates:
              raise SystemExit('pubspec.yaml not found')
          candidates.sort(key=lambda x: (x[0][1], x[0][0], x[0][2]))
          print(candidates[0][1])
          PY
          )"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Flutter project root: $ROOT"
          test -f "$ROOT/pubspec.yaml"
          test -f "$ROOT/lib/main.dart"

      - name: Android 빌드 래퍼 확인·보완
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          rm -rf .dart_tool build
          chmod -R u+rwX .
          if [ ! -f android/gradlew ] || { [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; }; then
            echo "Android 플랫폼 파일이 없어 Flutter 표준 Android 래퍼를 생성합니다."
            flutter create --platforms=android --org com.dk8832 --project-name certi_on .
          fi
          test -f android/gradlew
          chmod +x android/gradlew

      - name: Flutter 의존성 설치
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          flutter pub get

      - name: ARM64 Release APK 실제 빌드
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          flutter build apk --release --target-platform android-arm64
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          OUT="$RUNNER_TEMP/$EXPECTED_APK"
          cp "$APK" "$OUT"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"
          sha256sum "$OUT"
          ls -lh "$OUT"

      - name: 해당 GitHub Release Assets에 APK 업로드
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$APK_PATH" -R "$REPO" --clobber

      - name: Release APK 최종 검증
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -Fxq "$EXPECTED_APK"
          echo "$TAG -> $EXPECTED_APK 존재 확인 완료"
