name: CERTI:ON v3.0.0 responsive QA and release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certion-v3-release.yml'

permissions:
  contents: write

jobs:
  qa-build-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - name: Apply v3 responsive fixes in workspace
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # ---------- Flutter app ----------
          dart = Path('앱/lib/main.dart')
          s = dart.read_text(encoding='utf-8')

          old = '                fit: BoxFit.cover,'
          new = '                fit: BoxFit.contain,'
          if old not in s:
              raise SystemExit('AppAssetThumb BoxFit.cover marker not found')
          s = s.replace(old, new, 1)

          home_marker = '      home: const AppShell(),'
          if home_marker not in s:
              raise SystemExit('MaterialApp home marker not found')
          builder = '''      builder: (context, child) {
        final media = MediaQuery.of(context);
        final frameWidth = math.min(media.size.width, 430.0);
        return ColoredBox(
          color: const Color(0xFFF3F0EE),
          child: Align(
            alignment: Alignment.topCenter,
            child: SizedBox(
              width: frameWidth,
              height: media.size.height,
              child: child ?? const SizedBox.shrink(),
            ),
          ),
        );
      },
      home: const AppShell(),'''
          s = s.replace(home_marker, builder, 1)

          ratio_marker = '      childAspectRatio: 1.16,'
          if ratio_marker not in s:
              raise SystemExit('SmartToolGrid childAspectRatio marker not found')
          s = s.replace(ratio_marker, '      childAspectRatio: 0.74,', 1)

          dart.write_text(s, encoding='utf-8')

          pub = Path('앱/pubspec.yaml')
          p = pub.read_text(encoding='utf-8')
          if 'version: 2.0.0+10' not in p:
              raise SystemExit('Expected app version 2.0.0+10 not found')
          p = p.replace('version: 2.0.0+10', 'version: 3.0.0+11', 1)
          if 'dev_dependencies:' not in p:
              marker = '\nflutter:\n'
              if marker not in p:
                  raise SystemExit('pubspec flutter section marker not found')
              p = p.replace(marker, '\ndev_dependencies:\n  flutter_test:\n    sdk: flutter\n\nflutter:\n', 1)
          pub.write_text(p, encoding='utf-8')

          # Responsive smoke tests are kept as part of v3 source.
          test = Path('앱/test/responsive_smoke_test.dart')
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text(r'''import 'package:flutter/material.dart';
import 'package:flutter_test/flutter_test.dart';
import 'package:certi_on/main.dart' as certion;

void main() {
  final sizes = <Size>[
    const Size(320, 720),
    const Size(360, 800),
    const Size(390, 844),
    const Size(430, 932),
    const Size(600, 960),
  ];

  for (final size in sizes) {
    testWidgets('CERTI:ON home has no layout exception at ${size.width}x${size.height}', (tester) async {
      tester.view.devicePixelRatio = 1.0;
      tester.view.physicalSize = size;
      addTearDown(() {
        tester.view.resetPhysicalSize();
        tester.view.resetDevicePixelRatio();
      });

      await tester.pumpWidget(const certion.CertiOnApp());
      await tester.pump(const Duration(milliseconds: 800));
      expect(tester.takeException(), isNull);
      expect(find.text('CERTI:ON'), findsWidgets);

      final scroll = find.byType(CustomScrollView).first;
      await tester.drag(scroll, const Offset(0, -850));
      await tester.pump(const Duration(milliseconds: 500));
      expect(tester.takeException(), isNull);
      expect(find.text('스마트 준비 도구'), findsOneWidget);
    });
  }
}
''', encoding='utf-8')

          # ---------- Website ----------
          css = Path('웹/frontend/style.css')
          c = css.read_text(encoding='utf-8')
          marker = '/* CERTI:ON v3 mobile hardening */'
          if marker not in c:
              c += r'''

/* CERTI:ON v3 mobile hardening */
html, body {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
}
img, svg, video, canvas { max-width: 100%; }

@media (max-width: 700px) {
  .container {
    width: 100%;
    max-width: none;
    padding-left: 14px;
    padding-right: 14px;
  }

  .floating-nav {
    top: 10px;
    left: 12px;
    right: 12px;
    width: auto;
    max-width: none;
    transform: none;
    padding: 10px;
    gap: 8px;
    border-radius: 20px;
    flex-direction: column;
    align-items: stretch;
  }
  .floating-nav .logo {
    justify-content: center;
    width: 100%;
    font-size: 14px;
  }
  .view-switch {
    width: 100%;
    min-width: 0;
    overflow-x: auto;
    overscroll-behavior-inline: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    justify-content: flex-start;
  }
  .view-switch::-webkit-scrollbar,
  .filter-group::-webkit-scrollbar,
  .upcoming-row::-webkit-scrollbar { display: none; }
  .view-btn {
    flex: 0 0 auto;
    padding: 7px 11px;
    font-size: 12px;
  }

  main.container {
    padding-top: 138px;
    padding-bottom: 40px;
  }
  .hero-intro {
    max-width: none;
    margin-bottom: 28px;
  }
  .eyebrow { font-size: 10.5px; margin-bottom: 12px; }
  .display-h1 {
    font-size: clamp(26px, 8.4vw, 32px);
    line-height: 1.24;
    overflow-wrap: anywhere;
  }
  .hero-body { font-size: 13.5px; line-height: 1.65; }

  .app-download {
    grid-template-columns: minmax(0, 1fr);
    gap: 18px;
    padding: 22px 18px;
    border-radius: 22px;
    margin-bottom: 30px;
  }
  .app-download h2 { font-size: 24px; }
  .app-download-copy > p { font-size: 12.5px; }
  .app-download-actions {
    width: 100%;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
  }
  .app-download-button { width: 100%; }
  .app-install-link { text-align: center; }
  .app-install-panel { padding: 16px; }
  .app-install-panel li { font-size: 12px; }

  .upcoming-row {
    width: 100%;
    overflow-x: auto;
    scroll-snap-type: x proximity;
    scrollbar-width: none;
  }
  .upcoming-card {
    min-width: min(82vw, 280px);
    scroll-snap-align: start;
  }

  .filter-bar {
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
  }
  .filter-group {
    width: 100%;
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 3px;
  }
  .chip { flex: 0 0 auto; padding: 7px 13px; font-size: 12px; }
  .search-box, .search-box input { width: 100%; min-width: 0; }

  .calendar-nav { gap: 10px; }
  .calendar-weekdays { font-size: 10px; }
  .calendar-grid { gap: 3px; }
  .cal-cell {
    min-width: 0;
    min-height: 54px;
    padding: 4px 2px;
    border-radius: 10px;
  }
  .cal-cell .cal-date { font-size: 10px; }
  .cal-dots { gap: 2px; }
  .cal-dot { width: 5px; height: 5px; }

  .event-row {
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 8px;
  }
  .event-row .event-main { flex-basis: calc(100% - 24px); }
  .event-row .event-date { width: 100%; white-space: normal; }

  .rolling-row { display: grid; grid-template-columns: 1fr; }
  .footer-dark { margin-top: 40px; border-radius: 24px 24px 0 0; }
}

@media (max-width: 360px) {
  .container { padding-left: 12px; padding-right: 12px; }
  .floating-nav { left: 8px; right: 8px; top: 8px; padding: 8px; }
  .view-btn { font-size: 11px; padding: 7px 9px; }
  main.container { padding-top: 132px; }
  .display-h1 { font-size: 25px; }
  .app-download { padding: 20px 16px; }
  .app-download h2 { font-size: 22px; }
  .cal-cell { min-height: 50px; }
}
'''
          css.write_text(c, encoding='utf-8')

          html = Path('웹/frontend/index.html')
          h = html.read_text(encoding='utf-8')
          h = h.replace('v2.0.0 · Android · 설치 파일 확인 중', 'v3.0.0 · Android · 설치 파일 확인 중')
          h = h.replace('releases/download/v2.0.0/CERTI_ON_v2.0.0_ANDROID.apk', 'releases/download/v3.0.0/CERTI_ON_v3.0.0_ANDROID.apk')
          h = h.replace('download="CERTI_ON_v2.0.0_ANDROID.apk"', 'download="CERTI_ON_v3.0.0_ANDROID.apk"')
          html.write_text(h, encoding='utf-8')

          static = Path('웹/frontend/static_api.js')
          a = static.read_text(encoding='utf-8')
          a = a.replace('releases/download/v2.0.0/CERTI_ON_v2.0.0_ANDROID.apk', 'releases/download/v3.0.0/CERTI_ON_v3.0.0_ANDROID.apk')
          a = a.replace('CERTI_ON_v2.0.0_ANDROID.apk', 'CERTI_ON_v3.0.0_ANDROID.apk')
          a = a.replace('version: "2.0.0"', 'version: "3.0.0"')
          a = a.replace("version: '2.0.0'", "version: '3.0.0'")
          static.write_text(a, encoding='utf-8')

          print('v3 responsive patch applied')
          PY

      - name: Prepare Android project and dependencies
        shell: bash
        working-directory: 앱
        run: |
          flutter pub get
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi
          python3 <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              if 'minSdk = flutter.minSdkVersion' in s:
                  s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 26')
              p.write_text(s, encoding='utf-8')
          PY
          flutter pub get

      - name: Flutter static analysis
        working-directory: 앱
        run: flutter analyze lib/main.dart test/responsive_smoke_test.dart

      - name: Flutter multi-device responsive simulation
        working-directory: 앱
        run: flutter test test/responsive_smoke_test.dart --reporter expanded

      - name: Verify image fit and width normalization patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          s = Path('앱/lib/main.dart').read_text(encoding='utf-8')
          assert 'fit: BoxFit.contain,' in s
          assert 'fit: BoxFit.cover,' not in s
          assert 'math.min(media.size.width, 430.0)' in s
          assert 'childAspectRatio: 0.74' in s
          print('App visual invariants OK')
          PY

      - name: Build Android APK
        working-directory: 앱
        run: flutter build apk --release --target-platform android-arm64

      - name: Build iOS app without signing
        working-directory: 앱
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist/Payload
          cp -R '앱/build/ios/iphoneos/Runner.app' dist/Payload/
          (cd dist && zip -qry CERTI_ON_v3.0.0_IOS_UNSIGNED.ipa Payload)
          cp '앱/build/app/outputs/flutter-apk/app-release.apk' dist/CERTI_ON_v3.0.0_ANDROID.apk

      - name: Package complete app and web source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import zipfile

          dist = Path('dist')
          excludes = {'.dart_tool', 'build', '.gradle', '.idea', 'node_modules', '__pycache__', '.git'}
          exclude_files = {'.env', 'local.properties'}

          def archive(src: Path, out: Path, prefix: str):
              with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
                  for p in sorted(src.rglob('*')):
                      rel = p.relative_to(src)
                      if any(part in excludes for part in rel.parts):
                          continue
                      if p.name in exclude_files or not p.is_file():
                          continue
                      z.write(p, str(Path(prefix) / rel))

          archive(Path('앱'), dist / 'CERTI_ON_v3.0.0_APP_SOURCE.zip', 'CERTI_ON_v3.0.0_APP')
          archive(Path('웹'), dist / 'CERTI_ON_v3.0.0_WEB_SOURCE.zip', 'CERTI_ON_v3.0.0_WEB')
          PY

      - name: Web mobile browser simulation
        shell: bash
        run: |
          mkdir -p /tmp/certion-web-qa
          cd /tmp/certion-web-qa
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          cat > qa.js <<'JS'
          const { chromium } = require('playwright');
          const sizes = [
            {name:'phone-320', width:320, height:720},
            {name:'phone-360', width:360, height:800},
            {name:'phone-390', width:390, height:844},
            {name:'phone-430', width:430, height:932},
            {name:'tablet-768', width:768, height:1024},
            {name:'desktop-1440', width:1440, height:1000},
          ];
          (async () => {
            const browser = await chromium.launch({headless:true});
            for (const s of sizes) {
              const page = await browser.newPage({viewport:{width:s.width,height:s.height}});
              await page.goto('http://127.0.0.1:8765/index.html', {waitUntil:'networkidle'});
              await page.waitForTimeout(500);
              const result = await page.evaluate(() => {
                const nav = document.querySelector('.floating-nav').getBoundingClientRect();
                return {
                  innerWidth: window.innerWidth,
                  scrollWidth: document.documentElement.scrollWidth,
                  navLeft: nav.left,
                  navRight: nav.right,
                  navWidth: nav.width,
                };
              });
              if (result.scrollWidth > result.innerWidth + 1) {
                throw new Error(`${s.name}: horizontal overflow ${result.scrollWidth} > ${result.innerWidth}`);
              }
              if (result.navLeft < -1 || result.navRight > result.innerWidth + 1) {
                throw new Error(`${s.name}: nav outside viewport ${JSON.stringify(result)}`);
              }
              await page.screenshot({path:`${process.env.GITHUB_WORKSPACE}/qa-${s.name}.png`, fullPage:true});
              console.log(`${s.name}: OK`, result);
              await page.close();
            }
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          cd "$GITHUB_WORKSPACE/웹/frontend"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/certion-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cd /tmp/certion-web-qa
          node qa.js

      - name: Validate release files
        shell: bash
        run: |
          set -e
          test -s dist/CERTI_ON_v3.0.0_ANDROID.apk
          test -s dist/CERTI_ON_v3.0.0_IOS_UNSIGNED.ipa
          test -s dist/CERTI_ON_v3.0.0_APP_SOURCE.zip
          test -s dist/CERTI_ON_v3.0.0_WEB_SOURCE.zip
          unzip -tq dist/CERTI_ON_v3.0.0_APP_SOURCE.zip
          unzip -tq dist/CERTI_ON_v3.0.0_WEB_SOURCE.zip
          unzip -tq dist/CERTI_ON_v3.0.0_IOS_UNSIGNED.ipa
          shasum -a 256 dist/*

      - name: Commit verified v3 source to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '앱/lib/main.dart' '앱/pubspec.yaml' '앱/pubspec.lock' '앱/test' '앱/android' '웹/frontend/style.css' '웹/frontend/index.html' '웹/frontend/static_api.js'
          git commit -m 'release: CERTI:ON v3.0.0 responsive app and mobile web [skip ci]'
          git push origin HEAD:main

      - name: Create v3.0.0 release with four project assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## CERTI:ON v3.0.0

          Android·iPhone 앱과 공개 웹사이트의 **반응형 UI 안정화 릴리스**입니다.

          ### v2.0.0 대비 주요 개선
          - 앱의 콘텐츠 프레임을 최대 430 logical px로 정규화하여 최신 대화면 휴대폰·태블릿에서도 카드 폭과 배치가 과도하게 늘어나지 않도록 수정했습니다.
          - 모든 앱 일러스트 썸네일을 `BoxFit.contain` 기준으로 통일하여 원본 이미지 비율을 보존하고 잘림/확대 왜곡을 제거했습니다.
          - 홈의 스마트 준비 도구 카드 세로 비율을 재조정하여 화면 폭 변화에 따른 텍스트 잘림과 카드 내부 오버플로를 줄였습니다.
          - 320×720부터 600×960까지 Flutter 위젯 시뮬레이션을 추가해 레이아웃 예외가 없는지 자동 검증합니다.
          - 공개 웹사이트의 모바일 내비게이션을 2단 반응형 구조로 변경하고, 필터·다가오는 일정은 안전한 가로 스크롤로 처리했습니다.
          - 320/360/390/430/768/1440 px 브라우저 폭에서 가로 오버플로와 내비게이션 이탈 여부를 Playwright로 검증했습니다.
          - Android 프로젝트를 소스에 포함하여 저장소의 `앱` 폴더 자체에서 직접 APK 빌드가 가능하도록 정리했습니다.

          ### 자동 검증
          - `flutter analyze`
          - 다중 화면 크기 `flutter test`
          - Android ARM64 Release APK 실제 빌드
          - iOS Release `--no-codesign` 실제 빌드
          - Chromium 기반 모바일/태블릿/데스크톱 웹 레이아웃 시뮬레이션
          - APK/IPA/소스 ZIP 무결성 검사 및 SHA-256 계산

          ### Assets
          - `CERTI_ON_v3.0.0_APP_SOURCE.zip` — Flutter 앱 전체 소스(Android + iOS 포함)
          - `CERTI_ON_v3.0.0_WEB_SOURCE.zip` — CERTI:ON 웹 전체 소스
          - `CERTI_ON_v3.0.0_ANDROID.apk` — Android ARM64 Release APK
          - `CERTI_ON_v3.0.0_IOS_UNSIGNED.ipa` — iOS unsigned IPA

          > iOS IPA는 Apple 코드서명이 없는 빌드 결과물입니다. 실제 iPhone 설치 시 자신의 Apple Developer/Apple ID 서명이 필요합니다.
          EOF
          gh release create v3.0.0 \
            dist/CERTI_ON_v3.0.0_APP_SOURCE.zip \
            dist/CERTI_ON_v3.0.0_WEB_SOURCE.zip \
            dist/CERTI_ON_v3.0.0_ANDROID.apk \
            dist/CERTI_ON_v3.0.0_IOS_UNSIGNED.ipa \
            --repo DK8832/innovation \
            --target "$(git rev-parse HEAD)" \
            --title 'CERTI:ON v3.0.0 — 앱·웹 반응형 UI 안정화' \
            --notes-file /tmp/release-notes.md \
            --latest

      - name: Deploy verified website to gh-pages
        shell: bash
        run: |
          git fetch origin gh-pages:gh-pages
          rm -rf /tmp/certion-gh-pages
          git worktree add /tmp/certion-gh-pages gh-pages
          rsync -a --delete --exclude='.git' '웹/frontend/' /tmp/certion-gh-pages/
          touch /tmp/certion-gh-pages/.nojekyll
          cd /tmp/certion-gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'deploy: CERTI:ON v3.0.0 mobile responsive web [skip ci]'
            git push origin HEAD:gh-pages
          fi

      - name: Upload responsive QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: certion-v3-responsive-qa
          path: qa-*.png
          retention-days: 7
