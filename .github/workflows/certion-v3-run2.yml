name: "CERTI-ON v3 release retry"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/certion-v3-run2.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable
          cache: true

      - name: Apply workspace patches
        run: |
          python3 .github/scripts/v3_patch.py
          python3 .github/scripts/v3_patch_nav.py

      - name: Prepare Flutter project
        working-directory: 앱
        run: |
          flutter pub get
          if [ ! -d android ]; then flutter create --platforms=android .; fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          if p.exists():
              s = p.read_text(encoding='utf-8').replace('minSdk = flutter.minSdkVersion', 'minSdk = 26')
              p.write_text(s, encoding='utf-8')
          PY
          flutter pub get

      - name: Analyze
        working-directory: 앱
        run: flutter analyze lib/main.dart test/responsive_smoke_test.dart

      - name: Simulate multiple app sizes
        working-directory: 앱
        run: flutter test test/responsive_smoke_test.dart --reporter expanded

      - name: Verify app responsive invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('앱/lib/main.dart').read_text(encoding='utf-8')
          assert 'fit: BoxFit.contain,' in s and 'fit: BoxFit.cover,' not in s
          assert 'math.min(media.size.width, 430.0)' in s
          assert 'childAspectRatio: 0.74' in s
          assert 'class _CertiBottomNav extends StatelessWidget' in s
          print('Flutter visual invariants OK')
          PY

      - name: Build APK
        working-directory: 앱
        run: flutter build apk --release --target-platform android-arm64

      - name: Build iOS unsigned
        working-directory: 앱
        run: flutter build ios --release --no-codesign

      - name: Package release files
        run: |
          rm -rf dist
          mkdir -p dist/Payload
          cp -R '앱/build/ios/iphoneos/Runner.app' dist/Payload/
          (cd dist && zip -qry CERTI_ON_v3.0.0_IOS_UNSIGNED.ipa Payload)
          cp '앱/build/app/outputs/flutter-apk/app-release.apk' dist/CERTI_ON_v3.0.0_ANDROID.apk
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          dist=Path('dist'); excludes={'.dart_tool','build','.gradle','.idea','node_modules','__pycache__','.git'}; files={'.env','local.properties'}
          def pack(src,out,prefix):
              src=Path(src)
              with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for p in sorted(src.rglob('*')):
                      rel=p.relative_to(src)
                      if any(x in excludes for x in rel.parts) or p.name in files or not p.is_file(): continue
                      z.write(p,str(Path(prefix)/rel))
          pack('앱',dist/'CERTI_ON_v3.0.0_APP_SOURCE.zip','CERTI_ON_v3.0.0_APP')
          pack('웹',dist/'CERTI_ON_v3.0.0_WEB_SOURCE.zip','CERTI_ON_v3.0.0_WEB')
          PY

      - name: Simulate responsive website
        run: |
          mkdir -p /tmp/certion-web-qa && cd /tmp/certion-web-qa
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          cd "$GITHUB_WORKSPACE/웹/frontend"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/certion-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2
          cd /tmp/certion-web-qa
          cp "$GITHUB_WORKSPACE/.github/scripts/web_qa.js" .
          node web_qa.js

      - name: Validate packages
        run: |
          test -s dist/CERTI_ON_v3.0.0_ANDROID.apk
          test -s dist/CERTI_ON_v3.0.0_IOS_UNSIGNED.ipa
          test -s dist/CERTI_ON_v3.0.0_APP_SOURCE.zip
          test -s dist/CERTI_ON_v3.0.0_WEB_SOURCE.zip
          unzip -tq dist/CERTI_ON_v3.0.0_APP_SOURCE.zip
          unzip -tq dist/CERTI_ON_v3.0.0_WEB_SOURCE.zip
          unzip -tq dist/CERTI_ON_v3.0.0_IOS_UNSIGNED.ipa
          shasum -a 256 dist/CERTI_ON_v3.0.0_*

      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '앱/lib/main.dart' '앱/pubspec.yaml' '앱/pubspec.lock' '앱/test' '앱/android' '웹/frontend/style.css' '웹/frontend/index.html' '웹/frontend/static_api.js'
          git commit -m 'release: CERTI:ON v3.0.0 responsive app and mobile web [skip ci]'
          git push origin HEAD:main

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/notes.md <<'EOF'
          ## CERTI:ON v3.0.0

          앱과 웹의 화면 비율·이미지 비율·모바일 반응형 문제를 함께 정리한 안정화 릴리스입니다.

          ### v2.0.0 대비 개선
          - 앱 전체 콘텐츠를 최대 430 logical px 프레임으로 정규화하여 넓은 최신 기기에서도 동일한 카드 비율 유지
          - 5개 하단 메뉴를 가변폭 커스텀 내비게이션으로 변경하여 320px급 좁은 화면까지 오버플로 제거
          - 모든 앱 일러스트를 `BoxFit.contain`으로 통일하여 사진/일러스트 원본 비율 보존
          - 스마트 준비 도구 카드 세로 비율을 조정하여 이미지와 설명 텍스트 잘림 개선
          - 320×720 / 360×800 / 390×844 / 430×932 / 600×960 Flutter 시뮬레이션 통과
          - 웹 모바일 상단 메뉴를 2단 반응형 구조로 변경하고 필터·일정 카드 가로 스크롤 최적화
          - 320/360/390/430/768/1440px Chromium 시뮬레이션에서 페이지 가로 오버플로와 메뉴 이탈 검사
          - Android 프로젝트 소스를 앱 폴더에 포함하여 직접 APK 빌드 가능한 구조로 보강

          ### 검증
          - flutter analyze
          - flutter test 다중 화면 크기
          - Android ARM64 Release APK 실제 빌드
          - iOS Release --no-codesign 실제 빌드
          - Playwright Chromium 반응형 웹 검사
          - APK/IPA/ZIP 무결성 검사 및 SHA-256 계산

          ### Assets
          - `CERTI_ON_v3.0.0_APP_SOURCE.zip` — 앱 전체 코드(Android + iOS)
          - `CERTI_ON_v3.0.0_WEB_SOURCE.zip` — 웹 전체 코드
          - `CERTI_ON_v3.0.0_ANDROID.apk` — Android APK
          - `CERTI_ON_v3.0.0_IOS_UNSIGNED.ipa` — iOS unsigned IPA

          > iOS IPA는 Apple 코드서명이 없는 빌드입니다. 실제 iPhone 설치에는 본인의 Apple 서명이 필요합니다.
          EOF
          gh release create v3.0.0 dist/CERTI_ON_v3.0.0_APP_SOURCE.zip dist/CERTI_ON_v3.0.0_WEB_SOURCE.zip dist/CERTI_ON_v3.0.0_ANDROID.apk dist/CERTI_ON_v3.0.0_IOS_UNSIGNED.ipa --repo DK8832/innovation --target "$(git rev-parse HEAD)" --title 'CERTI:ON v3.0.0 — 앱·웹 반응형 UI 안정화' --notes-file /tmp/notes.md --latest

      - name: Deploy web to gh-pages
        run: |
          git fetch origin gh-pages:gh-pages
          rm -rf /tmp/certion-gh-pages
          git worktree add /tmp/certion-gh-pages gh-pages
          rsync -a --delete --exclude='.git' '웹/frontend/' /tmp/certion-gh-pages/
          touch /tmp/certion-gh-pages/.nojekyll
          cd /tmp/certion-gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'deploy: CERTI:ON v3.0.0 mobile responsive web [skip ci]'
            git push origin HEAD:gh-pages
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certion-v3-responsive-qa-retry
          path: qa-*.png
          retention-days: 7
