name: "CERTI-ON v3 verified release"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/certion-v3-run5.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable
          cache: true

      - name: Apply all v3 patches
        run: |
          python3 .github/scripts/v3_patch.py
          python3 .github/scripts/v3_patch_nav.py
          python3 .github/scripts/v3_patch_scale.py
          python3 .github/scripts/v3_patch_test.py
          python3 .github/scripts/v3_patch_ios.py

      - name: Prepare Flutter Android and dependencies
        working-directory: 앱
        run: |
          flutter pub get
          if [ ! -d android ]; then flutter create --platforms=android .; fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          if p.exists():
              p.write_text(p.read_text(encoding='utf-8').replace('minSdk = flutter.minSdkVersion','minSdk = 26'),encoding='utf-8')
          PY
          flutter pub get

      - name: Analyze and simulate five app sizes
        working-directory: 앱
        run: |
          flutter analyze lib/main.dart test/responsive_smoke_test.dart
          flutter test test/responsive_smoke_test.dart --reporter expanded

      - name: Assert image and responsive rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('앱/lib/main.dart').read_text(encoding='utf-8')
          a=Path('앱/ios/Runner/AppDelegate.swift').read_text(encoding='utf-8')
          assert 'fit: BoxFit.contain,' in s and 'fit: BoxFit.cover,' not in s
          assert 'const designWidth = 430.0;' in s
          assert 'final designHeight = media.size.height / scale;' in s
          assert 'childAspectRatio: 0.74' in s
          assert 'class _CertiBottomNav extends StatelessWidget' in s
          assert 'FlutterImplicitEngineDelegate' not in a
          assert 'GeneratedPluginRegistrant.register(with: self)' in a
          print('CERTI:ON v3 app invariants OK')
          PY

      - name: Build iOS release first
        working-directory: 앱
        run: flutter build ios --release --no-codesign

      - name: Build Android ARM64 APK
        working-directory: 앱
        run: flutter build apk --release --target-platform android-arm64

      - name: Package app web APK IPA
        run: |
          rm -rf dist
          mkdir -p dist/Payload
          cp -R '앱/build/ios/iphoneos/Runner.app' dist/Payload/
          (cd dist && zip -qry CERTI_ON_v3.0.0_IOS_UNSIGNED.ipa Payload)
          cp '앱/build/app/outputs/flutter-apk/app-release.apk' dist/CERTI_ON_v3.0.0_ANDROID.apk
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          excludes={'.dart_tool','build','.gradle','.idea','node_modules','__pycache__','.git'}
          skip={'.env','local.properties'}
          def pack(src,out,prefix):
              src=Path(src)
              with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for p in sorted(src.rglob('*')):
                      rel=p.relative_to(src)
                      if any(x in excludes for x in rel.parts) or p.name in skip or not p.is_file(): continue
                      z.write(p,str(Path(prefix)/rel))
          pack('앱',Path('dist/CERTI_ON_v3.0.0_APP_SOURCE.zip'),'CERTI_ON_v3.0.0_APP')
          pack('웹',Path('dist/CERTI_ON_v3.0.0_WEB_SOURCE.zip'),'CERTI_ON_v3.0.0_WEB')
          PY

      - name: Simulate mobile tablet desktop website
        run: |
          mkdir -p /tmp/certion-web-qa && cd /tmp/certion-web-qa
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          cp "$GITHUB_WORKSPACE/.github/scripts/web_qa.js" .
          node web_qa.js

      - name: Validate four assets
        run: |
          for f in \
            dist/CERTI_ON_v3.0.0_APP_SOURCE.zip \
            dist/CERTI_ON_v3.0.0_WEB_SOURCE.zip \
            dist/CERTI_ON_v3.0.0_ANDROID.apk \
            dist/CERTI_ON_v3.0.0_IOS_UNSIGNED.ipa; do test -s "$f"; done
          unzip -tq dist/CERTI_ON_v3.0.0_APP_SOURCE.zip
          unzip -tq dist/CERTI_ON_v3.0.0_WEB_SOURCE.zip
          unzip -tq dist/CERTI_ON_v3.0.0_IOS_UNSIGNED.ipa
          shasum -a 256 dist/CERTI_ON_v3.0.0_*

      - name: Commit only verified v3 code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '앱/lib/main.dart' '앱/pubspec.yaml' '앱/pubspec.lock' '앱/test' '앱/android' '앱/ios/Runner/AppDelegate.swift' '웹/frontend/style.css' '웹/frontend/index.html' '웹/frontend/static_api.js'
          git commit -m 'release: CERTI:ON v3.0.0 responsive app and mobile web [skip ci]'
          git push origin HEAD:main

      - name: Publish v3.0.0 with four assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/notes.md <<'EOF'
          ## CERTI:ON v3.0.0

          앱의 사진·일러스트 비율, 휴대폰별 화면 폭 차이, 웹사이트의 모바일 레이아웃 깨짐을 함께 해결한 반응형 안정화 버전입니다.

          ### v2.0.0 대비 개선
          - 앱을 430 logical px 디자인 프레임 기준으로 정규화하고 좁은 기기에서는 전체 UI를 같은 비율로 축소하여 서로 다른 기기에서도 동일한 레이아웃 비율을 유지합니다.
          - 넓은 최신 휴대폰·태블릿에서는 콘텐츠 폭을 430px로 유지해 카드가 과도하게 늘어나는 현상을 막았습니다.
          - 모든 앱 일러스트 썸네일을 `BoxFit.contain`으로 바꿔 원본 종횡비를 유지하고 사진 잘림·확대 왜곡을 제거했습니다.
          - 하단 5개 메뉴를 가변폭 구조로 보강하고 스마트 준비 도구 카드의 세로 비율을 조정했습니다.
          - Flutter 3.35.5와 호환되는 iOS AppDelegate로 정리하여 iOS Release 빌드를 다시 검증했습니다.
          - 웹 모바일 상단 메뉴를 2단 반응형 구조로 변경하고 필터·일정 카드·캘린더를 모바일 화면에 맞게 재배치했습니다.

          ### 자동 검증
          - Flutter: 320×720 / 360×800 / 390×844 / 430×932 / 600×960
          - Chromium 웹: 320 / 360 / 390 / 430 / 768 / 1440px
          - `flutter analyze`, `flutter test`
          - Android ARM64 Release APK 실제 빌드
          - iOS Release `--no-codesign` 실제 빌드
          - 웹 가로 오버플로·내비게이션 이탈 검사
          - ZIP/IPA 무결성 및 SHA-256 검사

          ### Assets
          - `CERTI_ON_v3.0.0_APP_SOURCE.zip` — 앱 전체 코드(Android + iOS)
          - `CERTI_ON_v3.0.0_WEB_SOURCE.zip` — 웹 전체 코드
          - `CERTI_ON_v3.0.0_ANDROID.apk` — Android 설치 파일
          - `CERTI_ON_v3.0.0_IOS_UNSIGNED.ipa` — iOS unsigned IPA

          > iOS IPA는 Apple 코드서명이 없는 빌드입니다. 실제 iPhone 설치에는 본인의 Apple 서명이 필요합니다.
          EOF
          gh release create v3.0.0 \
            dist/CERTI_ON_v3.0.0_APP_SOURCE.zip \
            dist/CERTI_ON_v3.0.0_WEB_SOURCE.zip \
            dist/CERTI_ON_v3.0.0_ANDROID.apk \
            dist/CERTI_ON_v3.0.0_IOS_UNSIGNED.ipa \
            --repo DK8832/innovation \
            --target "$(git rev-parse HEAD)" \
            --title 'CERTI:ON v3.0.0 — 앱·웹 반응형 UI 안정화' \
            --notes-file /tmp/notes.md \
            --latest

      - name: Deploy verified web to gh-pages
        run: |
          git fetch origin gh-pages:gh-pages
          rm -rf /tmp/certion-gh-pages
          git worktree add /tmp/certion-gh-pages gh-pages
          rsync -a --delete --exclude='.git' '웹/frontend/' /tmp/certion-gh-pages/
          touch /tmp/certion-gh-pages/.nojekyll
          cd /tmp/certion-gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'deploy: CERTI:ON v3.0.0 responsive mobile web [skip ci]'
            git push origin HEAD:gh-pages
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certion-v3-verified-responsive-screenshots
          path: qa-*.png
          retention-days: 7
