name: "CERTI-ON v3 web responsive QA"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/certion-v3-webqa.yml"

jobs:
  webqa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply v3 web patch in QA workspace
        run: python3 .github/scripts/v3_patch.py
      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/certion-web-qa
          cd /tmp/certion-web-qa
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Test six responsive widths
        run: |
          cd /tmp/certion-web-qa
          cp "$GITHUB_WORKSPACE/.github/scripts/web_qa.js" .
          node web_qa.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certion-v3-web-responsive-screenshots
          path: qa-*.png
          retention-days: 7
