name: CERTI:ON iOS 검증 소스 패키지 생성

on:
  push:
    branches:
      - ios-support-v9-test
    paths:
      - '.github/workflows/export-ios-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: 검증 완료 소스 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ios-support-v9-test

      - name: iOS 지원 프로젝트 ZIP 생성
        shell: bash
        run: |
          set -euo pipefail
          rm -rf export
          mkdir -p export/CERTI_ON_V9_ANDROID_IOS
          shopt -s dotglob nullglob
          for item in * .*; do
            case "$item" in
              .|..|.git|.github|.dart_tool|build|export) continue ;;
            esac
            cp -a "$item" export/CERTI_ON_V9_ANDROID_IOS/
          done
          cd export
          zip -qr CERTI_ON_V9_ANDROID_IOS_VERIFIED.zip CERTI_ON_V9_ANDROID_IOS
          unzip -t CERTI_ON_V9_ANDROID_IOS_VERIFIED.zip
          test -f CERTI_ON_V9_ANDROID_IOS/ios/Runner.xcodeproj/project.pbxproj
          test -f CERTI_ON_V9_ANDROID_IOS/IOS_INSTALL_KR.md

      - name: 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: CERTI_ON_V9_ANDROID_IOS_VERIFIED
          path: export/CERTI_ON_V9_ANDROID_IOS_VERIFIED.zip
          if-no-files-found: error
          retention-days: 30
