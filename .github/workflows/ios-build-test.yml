name: CERTI:ON iOS 지원 생성 및 빌드 검증

on:
  push:
    branches:
      - ios-support-v9-test
    paths:
      - '.github/workflows/ios-build-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios-build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: 프로젝트 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ios-support-v9-test
          fetch-depth: 0

      - name: Flutter stable 설치
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version
          "$HOME/flutter/bin/flutter" config --no-analytics

      - name: iOS 플랫폼 프로젝트 생성
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=ios --org com.dk8832 --project-name certi_on .
          test -f ios/Runner/Info.plist
          test -f ios/Runner.xcodeproj/project.pbxproj
          rm -rf .idea test certi_on.iml analysis_options.yaml

      - name: iPhone 호환 동작 패치
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')

          old = '  bool _phoneMode = true;'
          new = '  bool _phoneMode = Platform.isAndroid;'
          if old not in s:
              raise SystemExit('phone mode initializer not found')
          s = s.replace(old, new, 1)

          old = '''  void _setMode(bool phoneMode) {\n    if (_loading || _downloading) return;\n    setState(() {'''
          new = '''  void _setMode(bool phoneMode) {\n    if (_loading || _downloading) return;\n    if (phoneMode && !Platform.isAndroid) {\n      ScaffoldMessenger.of(context).showSnackBar(\n        const SnackBar(content: Text('iPhone에서는 현재 휴대폰 단독 GGUF AI 대신 PC 고성능 AI를 사용합니다.')),\n      );\n      return;\n    }\n    setState(() {'''
          if old not in s:
              raise SystemExit('_setMode block not found')
          s = s.replace(old, new, 1)

          old = "          onPressed: (_loading || _downloading) ? null : () => _setMode(phone),"
          new = "          onPressed: (_loading || _downloading || (phone && !Platform.isAndroid)) ? null : () => _setMode(phone),"
          if old not in s:
              raise SystemExit('_modeButton onPressed not found')
          s = s.replace(old, new, 1)

          old = "          _modeButton(phone: true, title: '휴대폰 단독', subtitle: '노트북/서버 불필요'),"
          new = "          _modeButton(phone: true, title: '휴대폰 단독', subtitle: Platform.isAndroid ? '노트북/서버 불필요' : 'Android 전용'),"
          if old not in s:
              raise SystemExit('phone mode button call not found')
          s = s.replace(old, new, 1)

          old = "        '• 기본 모드에서는 GGUF 모델을 휴대폰 내부에 1회 내려받아 기기에서 직접 실행하므로 별도 API 키나 서버가 필요하지 않습니다.\\n'\n        '• 선택적으로 PC 고성능 모드를 켜면 같은 Wi-Fi의 Ollama 서버를 사용할 수 있습니다.\\n'"
          new = "        '• Android에서는 GGUF 모델을 휴대폰 내부에 내려받아 기기에서 직접 실행할 수 있습니다.\\n'\n        '• iPhone에서는 현재 공식 일정·플래너 기능과 같은 Wi-Fi의 PC Ollama AI 모드를 사용할 수 있습니다.\\n'\n        '• PC 고성능 모드는 Qwen3 14B/8B/4B Ollama 서버를 선택적으로 사용합니다.\\n'"
          if old not in s:
              raise SystemExit('privacy text block not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: iOS 네트워크 권한 및 번들 설정
        shell: bash
        run: |
          set -euo pipefail
          PLIST='ios/Runner/Info.plist'
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string CERTI:ON이 같은 Wi-Fi의 PC AI 서버와 통신할 때 로컬 네트워크 접근이 필요합니다." "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :NSLocalNetworkUsageDescription CERTI:ON이 같은 Wi-Fi의 PC AI 서버와 통신할 때 로컬 네트워크 접근이 필요합니다." "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :NSAppTransportSecurity dict' "$PLIST" || true
          /usr/libexec/PlistBuddy -c 'Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true' "$PLIST" || \
            /usr/libexec/PlistBuddy -c 'Set :NSAppTransportSecurity:NSAllowsLocalNetworking true' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName CERTI:ON' "$PLIST" || true

      - name: 의존성 설치 및 정적 검사
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/main.dart
          flutter analyze lib/main.dart

      - name: iOS Release 실제 빌드 검증
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign
          test -d build/ios/iphoneos/Runner.app
          echo 'iOS unsigned Release build OK'

      - name: iOS 지원 소스만 브랜치에 반영
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github
          cat > IOS_INSTALL_KR.md <<'EOF'
          # CERTI:ON iPhone 설치 안내

          이 프로젝트는 iOS 프로젝트 파일을 포함하며 macOS GitHub Actions에서 `flutter build ios --release --no-codesign` 실제 빌드 검증을 통과한 소스입니다.

          ## Mac + Xcode로 iPhone에 설치
          1. Mac에 최신 Flutter와 Xcode를 설치합니다.
          2. 이 프로젝트 폴더에서 `flutter pub get`을 실행합니다.
          3. `open ios/Runner.xcworkspace`를 실행합니다.
          4. Xcode의 Runner > Signing & Capabilities에서 자신의 Apple Team을 선택하고 Bundle Identifier를 고유한 값으로 설정합니다.
          5. iPhone을 연결하고 Developer Mode를 켠 뒤 Xcode에서 Run을 누릅니다.

          ## 기능 차이
          - Android: 휴대폰 내부 Qwen3 GGUF AI + PC Ollama AI 지원
          - iPhone: 공식 일정/탐색/캘린더/플래너 등 앱 기능 + 같은 Wi-Fi의 PC Ollama AI 지원
          - Android 전용 `llama_flutter_android` 기반 휴대폰 단독 AI 버튼은 iPhone에서 비활성화됩니다.

          iOS에서 PC AI를 사용할 때 로컬 네트워크 권한 요청이 표시될 수 있습니다.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add verified iPhone/iOS support'
          git push origin HEAD:ios-support-v9-test
