name: Audit and publish CERTI:ON historical releases

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-version-releases.yml'
      - 'release_catalog/**'
      - 'tools/generate_release_docs.py'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-audit-and-publish:
    name: Verify 24 snapshots and publish release metadata
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate professional release notes from audited catalog
        shell: bash
        run: |
          set -euo pipefail
          python tools/generate_release_docs.py

      - name: Verify all 24 historical source assets before changing releases
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t catalog_files < <(find release_catalog -maxdepth 1 -name 'part-*.json' -type f | sort)
          [[ "${#catalog_files[@]}" -gt 0 ]] || { echo 'No catalog files found.' >&2; exit 1; }
          catalog="$(jq -s 'add | sort_by(.order)' "${catalog_files[@]}")"
          expected_count="$(jq 'length' <<<"$catalog")"
          [[ "$expected_count" == "24" ]] || { echo "Expected 24 catalog entries, got $expected_count" >&2; exit 1; }

          pass=0
          while IFS= read -r row; do
            tag="$(jq -r '.tag' <<<"$row")"
            asset="$(jq -r '.asset' <<<"$row")"
            sha="$(jq -r '.sha256' <<<"$row")"
            release_json="$(gh api "repos/$REPO/releases/tags/$tag")"

            asset_count="$(jq --arg asset "$asset" '[.assets[] | select(.name == $asset)] | length' <<<"$release_json")"
            [[ "$asset_count" == "1" ]] || { echo "[$tag] expected exactly one $asset, got $asset_count" >&2; exit 1; }

            state="$(jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .state' <<<"$release_json")"
            digest="$(jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .digest // ""' <<<"$release_json")"
            [[ "$state" == "uploaded" ]] || { echo "[$tag] asset state=$state" >&2; exit 1; }
            [[ "$digest" == "sha256:$sha" ]] || {
              echo "[$tag] SHA-256 mismatch" >&2
              echo " expected: sha256:$sha" >&2
              echo " actual:   $digest" >&2
              exit 1
            }
            echo "PASS $tag -> $asset ($digest)"
            pass=$((pass+1))
          done < <(jq -c '.[]' <<<"$catalog")

          [[ "$pass" == "24" ]] || { echo "Asset audit expected 24 PASS, got $pass" >&2; exit 1; }
          echo 'ASSET AUDIT: 24/24 PASS'

      - name: Apply professional titles, detailed notes and release status
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t catalog_files < <(find release_catalog -maxdepth 1 -name 'part-*.json' -type f | sort)
          catalog="$(jq -s 'add | sort_by(.order)' "${catalog_files[@]}")"

          while IFS= read -r row; do
            tag="$(jq -r '.tag' <<<"$row")"
            title="$(jq -r '.title' <<<"$row")"
            prerelease="$(jq -r '.prerelease' <<<"$row")"
            notes="releases/$tag/RELEASE_NOTES.md"
            [[ -f "$notes" ]] || { echo "Missing notes: $notes" >&2; exit 1; }

            if [[ "$prerelease" == "true" ]]; then
              gh release edit "$tag" --repo "$REPO" --title "$title" --notes-file "$notes" --prerelease
            else
              gh release edit "$tag" --repo "$REPO" --title "$title" --notes-file "$notes" --latest
            fi
            echo "UPDATED $tag -> $title"
          done < <(jq -c '.[]' <<<"$catalog")

      - name: Final metadata and integrity audit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t catalog_files < <(find release_catalog -maxdepth 1 -name 'part-*.json' -type f | sort)
          catalog="$(jq -s 'add | sort_by(.order)' "${catalog_files[@]}")"
          pass=0

          while IFS= read -r row; do
            tag="$(jq -r '.tag' <<<"$row")"
            title="$(jq -r '.title' <<<"$row")"
            asset="$(jq -r '.asset' <<<"$row")"
            sha="$(jq -r '.sha256' <<<"$row")"
            expected_pre="$(jq -r '.prerelease' <<<"$row")"
            release_json="$(gh api "repos/$REPO/releases/tags/$tag")"

            actual_title="$(jq -r '.name' <<<"$release_json")"
            actual_pre="$(jq -r '.prerelease' <<<"$release_json")"
            actual_digest="$(jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .digest // ""' <<<"$release_json")"

            [[ "$actual_title" == "$title" ]] || { echo "[$tag] title mismatch" >&2; exit 1; }
            [[ "$actual_pre" == "$expected_pre" ]] || { echo "[$tag] prerelease mismatch" >&2; exit 1; }
            [[ "$actual_digest" == "sha256:$sha" ]] || { echo "[$tag] digest mismatch after update" >&2; exit 1; }
            pass=$((pass+1))
          done < <(jq -c '.[]' <<<"$catalog")

          [[ "$pass" == "24" ]] || { echo "Expected 24 releases, got $pass" >&2; exit 1; }
          latest_tag="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')"
          [[ "$latest_tag" == "v1.0.0" ]] || { echo "Latest release is $latest_tag, expected v1.0.0" >&2; exit 1; }
          echo 'FINAL RELEASE AUDIT: 24/24 PASS; v1.0.0 is Latest'

      - name: Synchronize generated release documentation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md releases/; then
            echo 'Generated documentation is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md releases/
          git commit -m 'docs: synchronize audited release notes [skip ci]'
          if ! git push origin HEAD:main; then
            echo '::warning::Release metadata passed audit, but generated repository docs could not be pushed.'
          fi
