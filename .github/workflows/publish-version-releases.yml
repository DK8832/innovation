name: Publish CERTI-ON version releases

on:
  push:
    paths:
      - '.github/workflows/publish-version-releases.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish v0.1.0 through v1.0.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          versions=(
            v0.1.0 v0.2.0 v0.3.0 v0.4.0 v0.5.0 v0.6.0
            v0.7.0 v0.8.0 v0.9.0 v0.10.0 v0.11.0 v0.12.0
            v0.13.0 v0.14.0 v0.15.0 v0.16.0 v0.17.0 v0.18.0
            v0.19.0 v0.20.0 v0.21.0 v0.22.0 v0.23.0 v1.0.0
          )

          for tag in "${versions[@]}"; do
            notes="releases/${tag}/RELEASE_NOTES.md"

            if [[ ! -f "$notes" ]]; then
              echo "Missing release notes: $notes" >&2
              exit 1
            fi

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Updating existing release: $tag"
              gh release edit "$tag" \
                --title "$tag" \
                --notes-file "$notes"
            else
              echo "Creating release: $tag"
              gh release create "$tag" \
                --target "${GITHUB_SHA}" \
                --title "$tag" \
                --notes-file "$notes"
            fi
          done

          # Make the final integrated version the repository's Latest release.
          gh release edit v1.0.0 --latest

      - name: Verify all 24 releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(gh release list --limit 100 --json tagName --jq 'map(select(.tagName | test("^v(0\\.(?:[1-9]|1[0-9]|2[0-3])\\.0|1\\.0\\.0)$"))) | length')"
          echo "CERTI:ON release count: $count"
          if [[ "$count" != "24" ]]; then
            echo "Expected 24 releases, got $count" >&2
            exit 1
          fi
          gh release list --limit 30
