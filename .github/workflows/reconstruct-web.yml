name: CERTI:ON 웹 소스 재구성·검증

on:
  push:
    branches:
      - main
    paths:
      - '.web_payload_gz/**'
      - '.github/workflows/reconstruct-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python으로 웹 소스 재구성
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path

          files = {
              '.web_payload_gz/index.b64': '웹/frontend/index.html',
              '.web_payload_gz/app.b64': '웹/frontend/app.js',
              '.web_payload_gz/style.b64': '웹/frontend/style.css',
              '.web_payload_gz/static.b64': '웹/frontend/static_api.js',
              '.web_payload_gz/verify.b64': '웹/verify_all.py',
              '.web_payload_gz/docs.b64': '웹/docs/DATA_SOURCES.md',
          }
          for source, target in files.items():
              src = Path(source)
              dst = Path(target)
              encoded = ''.join(src.read_text(encoding='ascii').split())
              data = gzip.decompress(base64.b64decode(encoded, validate=True))
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(data)
              print(f'OK {source} -> {target}: {len(data)} bytes')
          PY

      - name: JavaScript·Python 문법 검사
        shell: bash
        run: |
          set -euo pipefail
          node --check '웹/frontend/app.js'
          node --check '웹/frontend/static_api.js'
          python3 - <<'PY'
          import py_compile
          from pathlib import Path
          for p in Path('웹').rglob('*.py'):
              py_compile.compile(str(p), doraise=True)
              print('PY OK', p)
          PY

      - name: FastAPI 의존성 설치
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r '웹/backend/requirements.txt'

      - name: 프로젝트 자동 검증 실행
        shell: bash
        run: |
          set -euo pipefail
          python3 '웹/verify_all.py'

      - name: 재구성된 웹 소스 커밋
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '웹'
          if git diff --cached --quiet; then
            echo '재구성 결과가 이미 동일합니다.'
          else
            git commit -m 'feat: CERTI:ON 웹 원본 소스 재구성 및 검증 완료'
            git push
          fi
