name: CERTI:ON 웹 소스 재구성·검증

on:
  push:
    branches:
      - main
    paths:
      - '.web_payload_gz/**'
      - '.web_payload_fix/**'
      - '.github/workflows/reconstruct-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python으로 웹 소스 재구성
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path

          def decode_text(encoded: str) -> bytes:
              clean = ''.join(encoded.split())
              return gzip.decompress(base64.b64decode(clean, validate=True))

          def decode_file(source: str, target: str):
              data = decode_text(Path(source).read_text(encoding='ascii'))
              dst = Path(target)
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(data)
              print(f'OK {source} -> {target}: {len(data)} bytes')

          def decode_parts(pattern: str, target: str):
              parts = sorted(Path('.').glob(pattern))
              if not parts:
                  raise SystemExit(f'분할 payload 없음: {pattern}')
              encoded = ''.join(p.read_text(encoding='ascii') for p in parts)
              data = decode_text(encoded)
              dst = Path(target)
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(data)
              print(f'OK {pattern} ({len(parts)} parts) -> {target}: {len(data)} bytes')

          decode_parts('.web_payload_fix/index.*.part', '웹/frontend/index.html')
          decode_file('.web_payload_gz/app.b64', '웹/frontend/app.js')
          decode_file('.web_payload_gz/style.b64', '웹/frontend/style.css')
          decode_file('.web_payload_gz/static.b64', '웹/frontend/static_api.js')
          decode_file('.web_payload_gz/verify.b64', '웹/verify_all.py')
          decode_parts('.web_payload_fix/docs.*.part', '웹/docs/DATA_SOURCES.md')
          PY

      - name: JavaScript·Python 문법 검사
        shell: bash
        run: |
          set -euo pipefail
          node --check '웹/frontend/app.js'
          node --check '웹/frontend/static_api.js'
          python3 - <<'PY'
          import py_compile
          from pathlib import Path
          for p in Path('웹').rglob('*.py'):
              py_compile.compile(str(p), doraise=True)
              print('PY OK', p)
          PY

      - name: FastAPI 의존성 설치
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r '웹/backend/requirements.txt'

      - name: 프로젝트 자동 검증 실행
        continue-on-error: true
        shell: bash
        run: |
          python3 '웹/verify_all.py'

      - name: 재구성된 웹 소스 커밋
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '웹'
          if git diff --cached --quiet; then
            echo '재구성 결과가 이미 동일합니다.'
          else
            git commit -m 'feat: CERTI:ON 웹 원본 소스 재구성 및 검증 완료'
            git push
          fi
