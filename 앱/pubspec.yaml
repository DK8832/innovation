name: certi_on
description: OGQ hackathon mobile prototype - official certificate schedules, AI briefing, planner, comparison and trust-first sync.
publish_to: "none"
version: 3.0.0+11

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  http: 1.6.0
  path_provider: 2.1.5
  llama_flutter_android:
    path: packages/llama_flutter_android

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/data/certificates.seed.json
    - assets/data/rolling_exams.json
    - assets/images/cat_ai.png
    - assets/images/cat_data.png
    - assets/images/cat_design.png
    - assets/images/cat_electric.png
    - assets/images/cat_it.png
    - assets/images/cat_language.png
    - assets/images/cat_management.png
    - assets/images/cat_misc.png
    - assets/images/cat_office.png
    - assets/images/cat_public.png
    - assets/images/cat_safety.png
    - assets/images/feature_ai.png
    - assets/images/feature_compare.png
    - assets/images/feature_hero.png
    - assets/images/feature_planner.png
    - assets/images/feature_profile.png
    - assets/images/feature_recommend.png
    - assets/images/feature_rolling.png
    - assets/images/feature_trust.png
